<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your CampSphere password.">
  <title>Reset Password - CampSphere</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="shortcut icon" href="assets/images/favicon.ico">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-light-blue d-flex flex-column min-vh-100">

  <!-- Top Bar Minimal -->
  <div class="py-2 bg-white border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand-logo" href="index.html">
        <div class="brand-icon"><i class="bi bi-tree-fill"></i></div>
        Camp<span class="highlight-text">Sphere</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme">
          <i class="bi bi-moon-stars-fill"></i> <span class="theme-label">Dark</span>
        </button>
        <button type="button" class="rtl-toggle-btn" aria-label="Toggle RTL">
          <i class="bi bi-translate"></i> <span class="rtl-label">RTL</span>
        </button>
        <a href="login.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
      </div>
    </div>
  </div>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-8">
        
        <div class="card-camp p-4 p-md-5 shadow-lg border-0">
          <div class="text-center mb-4">
            <h3 class="fw-bold text-navy mb-1">Set New Password</h3>
            <p class="text-muted small">Please enter your new password to regain access to your parent account.</p>
          </div>

          <form onsubmit="event.preventDefault(); window.showCampToast('Password reset successfully! You can now log in.', 'success', 'Password Updated'); setTimeout(() => window.location.href='login.html', 1500);">
            <div class="mb-3">
              <label class="form-label small fw-bold text-navy" for="resetPassword">New Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" id="resetPassword" placeholder="Minimum 8 characters" required autocomplete="new-password">
                <button class="btn btn-outline-secondary btn-toggle-password" type="button" data-target="resetPassword" aria-label="Toggle password visibility" title="Toggle password visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-navy" for="resetConfirmPassword">Confirm New Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-lock text-muted"></i></span>
                <input type="password" class="form-control" id="resetConfirmPassword" placeholder="Repeat new password" required autocomplete="new-password">
                <button class="btn btn-outline-secondary btn-toggle-password" type="button" data-target="resetConfirmPassword" aria-label="Toggle password visibility" title="Toggle password visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 shadow mb-3">
              <i class="bi bi-check2-circle me-1"></i> Update Password & Log In
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

<!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/dark-mode.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/navigation.js"></script>
</body>
</html>
