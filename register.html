<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a Parent Account at CampSphere - Register your family for Summer 2026.">
  <title>Parent Registration - CampSphere</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-light-blue d-flex flex-column min-vh-100">

  <!-- Main Header Navbar -->
  <nav class="navbar navbar-camp bg-white border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand-logo" href="index.html">
        <div class="brand-icon"><i class="bi bi-tree-fill"></i></div>
        Camp<span class="highlight-text">Sphere</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme">
          <i class="bi bi-moon-stars-fill"></i> <span class="theme-label">Dark</span>
        </button>
        <button type="button" class="rtl-toggle-btn" aria-label="Toggle RTL">
          <i class="bi bi-translate"></i> <span class="rtl-label">RTL</span>
        </button>
        <a href="login.html" class="btn btn-outline-primary btn-sm ms-1"><i class="bi bi-person-circle me-1"></i> Already have account?</a>
      </div>
    </div>
  </nav>

  <!-- Register Main Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        
        <div class="card-camp p-4 p-md-5 shadow-lg border-0">
          <div class="text-center mb-4">
            <h3 class="fw-bold text-navy mb-1">Create Parent Account</h3>
            <p class="text-muted small">Manage camper enrollments, medical forms, and live camp photos in one place.</p>
          </div>

          <form id="campRegisterForm">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold text-navy" for="registerFirstName">Parent First Name *</label>
                <input type="text" class="form-control" id="registerFirstName" placeholder="First Name" required value="Sarah">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-navy" for="registerLastName">Parent Last Name *</label>
                <input type="text" class="form-control" id="registerLastName" placeholder="Last Name" required value="Watson">
              </div>
              <div class="col-12">
                <label class="form-label small fw-bold text-navy" for="registerEmail">Email Address *</label>
                <input type="email" class="form-control" id="registerEmail" placeholder="sarah.watson@example.com" required value="sarah.watson@example.com">
              </div>
              <div class="col-12">
                <label class="form-label small fw-bold text-navy" for="registerPhone">Cell Phone Number *</label>
                <input type="tel" class="form-control" id="registerPhone" placeholder="(555) 000-0000" required value="(555) 019-2834">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-navy" for="registerPassword">Create Password *</label>
                <input type="password" class="form-control" id="registerPassword" placeholder="Minimum 6 characters" required value="password123">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-navy" for="registerConfirmPassword">Confirm Password *</label>
                <input type="password" class="form-control" id="registerConfirmPassword" placeholder="Repeat password" required value="password123">
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="termsAgree" required checked>
              <label class="form-check-label small text-muted" for="termsAgree">
                I agree to the <a href="safety.html" class="text-primary">CampSphere Terms of Service</a> and Privacy Policy.
              </label>
            </div>

            <button type="submit" class="btn btn-accent btn-lg w-100 shadow mb-3" id="registerSubmitBtn">
              <i class="bi bi-person-plus-fill me-1"></i> Register & Open Parent Portal
            </button>
          </form>

          <p class="text-center text-muted small mb-0">
            Already registered? <a href="login.html" class="fw-bold text-primary">Log In Here</a>
          </p>
        </div>

      </div>
    </div>
  </div>

<!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/dark-mode.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/forms.js"></script>
</body>
</html>
